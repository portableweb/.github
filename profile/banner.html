<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PortableWeb — Org Banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #ff00ff; }
  .banner {
    width: 924px;
    height: 340px;
    background:
      radial-gradient(700px 420px at 88% 18%, rgba(32,214,210,0.16), transparent 60%),
      radial-gradient(620px 420px at 70% 130%, rgba(37,99,235,0.20), transparent 60%),
      radial-gradient(560px 380px at 6% -20%, rgba(124,58,237,0.24), transparent 60%),
      #0b0b15;
    position: relative;
    overflow: hidden;
    font-family: "Geist", sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 60px;
  }
  .topbar { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #7c3aed 0%, #2563eb 50%, #20d6d2 100%); }

  /* faint stacked-sheet watermark on the right */
  .watermark { position: absolute; right: -36px; top: 50%; transform: translateY(-50%); opacity: 0.06; }

  .brand { display: flex; align-items: center; gap: 18px; }
  .brand .glyph { width: 64px; height: 64px; filter: drop-shadow(0 6px 24px rgba(124,58,237,0.4)); }
  .wordmark { font-size: 62px; font-weight: 700; letter-spacing: -0.035em; color: #f3f3ff; line-height: 1; }

  .tagline {
    margin-top: 22px;
    font-size: 23px;
    line-height: 1.4;
    font-weight: 400;
    color: #b9b9e0;
    max-width: 34ch;
    letter-spacing: -0.01em;
  }
  .tagline .accent {
    background: linear-gradient(90deg, #a78bfa 0%, #60a5fa 50%, #5eead4 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    font-weight: 600;
  }
  .tagline .mono { font-family: "Geist Mono", monospace; font-size: 0.92em; color: #dcdcf5; }

  .chips { margin-top: 30px; display: flex; gap: 10px; }
  .chip {
    font-family: "Geist Mono", monospace;
    font-size: 14px;
    white-space: nowrap;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #c9c9ec;
    border: 1px solid rgba(168,168,210,0.28);
    border-radius: 8px;
    padding: 8px 13px;
    background: rgba(168,168,210,0.06);
  }
  .chip.grad { border: none; color: #fff; background: linear-gradient(120deg, #7c3aed, #2563eb 55%, #20d6d2); }
</style>
</head>
<body>
  <div class="banner">
    <div class="topbar"></div>

    <svg class="watermark" width="380" height="380" viewBox="0 0 36 36" aria-hidden="true">
      <rect x="9" y="6.5" width="18" height="5" rx="2.5" fill="#ffffff" opacity="0.5"></rect>
      <rect x="7" y="11" width="22" height="6" rx="3" fill="#ffffff" opacity="0.75"></rect>
      <rect x="5" y="16.5" width="26" height="13.5" rx="4" fill="#ffffff"></rect>
    </svg>

    <div class="brand">
      <svg class="glyph" viewBox="0 0 36 36" aria-hidden="true">
        <rect x="9" y="6.5" width="18" height="5" rx="2.5" fill="#ffffff" opacity="0.42"></rect>
        <rect x="7" y="11" width="22" height="6" rx="3" fill="#ffffff" opacity="0.66"></rect>
        <rect x="5" y="16.5" width="26" height="13.5" rx="4" fill="#ffffff"></rect>
      </svg>
      <span class="wordmark">PortableWeb</span>
    </div>

    <p class="tagline">The missing <span class="accent">file format</span> for the interactive web. One <span class="mono">.pweb</span> file &mdash; offline, self-contained, runs anywhere.</p>

    <div class="chips">
      <span class="chip grad">.pweb</span>
      <span class="chip">W3C Community Group</span>
      <span class="chip">IETF Internet-Draft</span>
      <span class="chip">Offline-first</span>
    </div>
  </div>
</body>
</html>
